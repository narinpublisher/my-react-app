name: CI

# 트리거: main / develop 브랜치 push 또는 PR 시 실행
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Node.js 설치
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 3. 패키지 설치
      - name: Install dependencies
        run: npm ci

      # 4. 타입 체크
      - name: Type check
        run: npm run typecheck

      # 5. ESLint 검사
      - name: Lint
        run: npm run lint

      # 6. 테스트 실행
      - name: Test
        run: npm run test -- --run

      # 7. 빌드 확인
      - name: Build
        run: npm run build